<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ورود | مرکز آموزش</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="assets/css/auth-pages.css"><link rel="stylesheet" href="fonts/Vazirmatn.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body class="auth-body"><main class="auth-page login"><div class="auth-layout"><section class="auth-panel"><div class="auth-eyebrow">ورود</div><h2>ورود به حساب</h2><form class="auth-form" onsubmit="return false"><div class="auth-field"><label for="login-identity">ایمیل یا شماره موبایل</label><input class="auth-input" id="login-identity" type="text" autocomplete="username" placeholder="ایمیل یا شماره موبایل"></div><div class="auth-field"><label for="login-password">رمز عبور</label><div class="auth-input-wrap"><input class="auth-input" id="login-password" type="password" autocomplete="current-password" placeholder="رمز عبور"><button class="auth-toggle" type="button" aria-label="نمایش رمز عبور" onclick="toggleAuthPassword('login-password',this)"><i class="fas fa-eye"></i></button></div></div><div class="auth-row"><label class="auth-check"><input type="checkbox"> <span>مرا به خاطر بسپار</span></label><a class="auth-link" href="forgot-password.html">رمز عبور را فراموش کرده‌اید؟</a></div><a class="auth-submit" href="index.html"><span>ورود</span><i class="fas fa-arrow-left"></i></a></form><div class="auth-switch">حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a></div></section><section class="auth-panel"><div class="auth-eyebrow">ثبت‌نام</div><h2>ایجاد حساب</h2><form class="auth-form" onsubmit="return false"><div class="auth-field"><label for="register-name">نام و نام خانوادگی</label><input class="auth-input" id="register-name" type="text" autocomplete="name" placeholder="نام و نام خانوادگی"></div><div class="auth-field"><label for="register-email">ایمیل</label><input class="auth-input" id="register-email" type="email" autocomplete="email" placeholder="ایمیل"></div><div class="auth-field"><label for="register-mobile">شماره موبایل</label><input class="auth-input" id="register-mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="شماره موبایل"></div><div class="auth-field"><label for="register-password">رمز عبور</label><div class="auth-input-wrap"><input class="auth-input" id="register-password" type="password" autocomplete="new-password" placeholder="رمز عبور"><button class="auth-toggle" type="button" aria-label="نمایش رمز عبور" onclick="toggleAuthPassword('register-password',this)"><i class="fas fa-eye"></i></button></div></div><label class="auth-check"><input type="checkbox"> <span>قوانین و مقررات را می‌پذیرم</span></label><a class="auth-submit" href="index.html"><span>ثبت‌نام</span><i class="fas fa-arrow-left"></i></a></form><div class="auth-switch">قبلاً حساب ساخته‌اید؟ <a href="login.html">وارد شوید</a></div></section></div></main><script>function toggleAuthPassword(id,btn){const input=document.getElementById(id);const visible=input.type==='text';input.type=visible?'password':'text';btn.innerHTML=visible?'<i class="fas fa-eye"></i>':'<i class="fas fa-eye-slash"></i>';btn.setAttribute('aria-label',visible?'نمایش رمز عبور':'پنهان کردن رمز عبور')}</script><script src="app.js"></script></body></html>
